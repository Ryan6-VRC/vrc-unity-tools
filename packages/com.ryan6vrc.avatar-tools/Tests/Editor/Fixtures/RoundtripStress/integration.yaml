# covers: the cross-cluster whole-graph witness — a blend tree on a state deep in a nested, cross-
#         referenced sub-machine, reached by an absolute ref out of depth and returning by a bare local ref.
#
# Driver round-tripping lives in behaviours.yaml, which animates nothing: a driver op on a parameter a clip
# here binds is an error-tier refusal (`driverOnAnimatedParam`), and this fixture must compile.
schema: 1
controller: Integration_Fx
basis: avatar-root
role: fx
defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }
parameters:
  g:   bool
  Dir: { type: float, default: 0.5 }
  Out: { type: float, aap: true }
layers:
  - name: Integration
    machines:
      Deep:
        machines:
          Deeper:
            states:
              Tree:
                motion:
                  tree: 1d
                  param: Dir
                  children:
                    - { clip: aap_min, threshold: 0.0 }
                    - { clip: aap_max, threshold: 1.0 }
                transitions:
                  - { to: /Hub, when: [ g is false ] }     # absolute cross-machine ref out of depth
            default: Tree
        default: Deeper
    states:
      Hub:
        motion: { clip: aap_max }
        transitions:
          - { to: Deep, when: [ g is true ] }              # bare local -> sub-machine Deep
    default: Hub
clips:
  aap_min: { set: { Out: 0.0 } }
  aap_max: { set: { Out: 1.0 } }
