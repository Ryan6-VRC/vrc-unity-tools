# Debounce layer — worked example for the animator write substrate; the idiom is docs/gimmicks.md
# "Debounce / arbitration layer".
#
# The output is a DRIVER-written bool that no clip animates, and that split is the point of the example:
# `hold_on` holds a float AAP (`Level`) while Active and the bool belongs to the drivers alone. `runtime.md`
# §Animator evaluation has the ownership rule, and `RuleNonFloatParamCurve` refuses the alternative.

schema: 1
controller: Debounce_Fx
basis: avatar-root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  RawInput:  bool                        # the raw input, driven externally or by a contact
  Debounced: bool                        # the debounced output; DRIVER-written
  Level:     { type: float, aap: true }  # what the Active clip holds; never the output (see the header)

layers:
  - name: Debounce
    states:
      Idle:
        motion: ~
        behaviours:
          - driver: { set: { Debounced: 0 } }   # reset on every return to rest — a sub-dwell blip leaves 0
        transitions:
          - { to: Pending, when: [ RawInput is true ] }
      Pending:
        motion: { clip: timer }
        transitions:
          - { to: Active, when: [], exitTime: 1.0 }
          - { to: Idle,   when: [ RawInput is false ] }   # released before the dwell → no flip
      Active:
        motion: { clip: hold_on }
        behaviours:
          - driver: { set: { Debounced: 1 } }
        transitions:
          - { to: Idle, when: [ RawInput is false ] }
    default: Idle

clips:
  timer:   { seconds: 0.2 }                     # the dwell
  hold_on: { set: { Level: 1.0 } }
