# Float -> bool binary codec (encoder) — worked example for the animator write substrate; the idiom is
# docs/gimmicks.md "Float→bool binary codec".
#
# Truncating, not rounding: OscFloat=0.7 -> 0.101b = 0.625 -> bits [1,0,1].

schema: 1
controller: Codec_Fx
basis: avatar-root
role: fx

defaults:
  writeDefaults: on
  transition: { duration: 0, exitTime: none, interruption: none }

parameters:
  OscFloat: { type: float, default: 0.0 }   # the input to encode, in [0,1); driven externally
  Work:     { type: float, default: 0.0 }   # working residue
  bit0: bool                                  # MSB
  bit1: bool
  bit2: bool

layers:
  - name: Codec
    # Each walk state carries a tiny inert `tick` clip: a motionless state's exit-time hop takes the 1s
    # fallback (animator-schema.md §clips), so a multi-hop walk would crawl. The carrier is a speed control,
    # not a correctness fix.
    states:
      Start:
        motion: { clip: tick }
        behaviours:
          - driver: { copy: { Work: OscFloat } }
        transitions:
          - { to: Test0, when: [], exitTime: 1.0 }
      Test0:
        motion: { clip: tick }
        transitions:
          - { to: Accept0, when: [ Work greater 0.5 ] }   # listed first: accept as soon as the residue exceeds the weight
          - { to: Reject0, when: [], exitTime: 1.0 }         # else fall through when the tick ends
      Accept0:
        motion: { clip: tick }
        behaviours:
          - driver: { set: { bit0: 1 }, add: { Work: -0.5 } }
        transitions: [ { to: Test1, when: [], exitTime: 1.0 } ]
      Reject0:
        motion: { clip: tick }
        behaviours:
          - driver: { set: { bit0: 0 } }
        transitions: [ { to: Test1, when: [], exitTime: 1.0 } ]
      Test1:
        motion: { clip: tick }
        transitions:
          - { to: Accept1, when: [ Work greater 0.25 ] }
          - { to: Reject1, when: [], exitTime: 1.0 }
      Accept1:
        motion: { clip: tick }
        behaviours:
          - driver: { set: { bit1: 1 }, add: { Work: -0.25 } }
        transitions: [ { to: Test2, when: [], exitTime: 1.0 } ]
      Reject1:
        motion: { clip: tick }
        behaviours:
          - driver: { set: { bit1: 0 } }
        transitions: [ { to: Test2, when: [], exitTime: 1.0 } ]
      Test2:
        motion: { clip: tick }
        transitions:
          - { to: Accept2, when: [ Work greater 0.125 ] }
          - { to: Reject2, when: [], exitTime: 1.0 }
      Accept2:
        motion: { clip: tick }
        behaviours:
          - driver: { set: { bit2: 1 } }
        transitions: [ { to: Start, when: [], exitTime: 1.0 } ]   # loop: re-encode next cycle
      Reject2:
        motion: { clip: tick }
        behaviours:
          - driver: { set: { bit2: 0 } }
        transitions: [ { to: Start, when: [], exitTime: 1.0 } ]
    default: Start

clips:
  tick: { seconds: 0.02 }
