# Shared (named) blend tree — worked example for the `trees:` / `shared:` construct. Rules:
# docs/animator-schema.md §shared trees.
#
# One tree, authored once under `trees:`, with three parents: two states' own trees carry it as a child and a
# third state plays it directly. The compile emits ONE BlendTree sub-asset with three parent references, and
# DecompileController recovers the sharing rather than inlining it back.

schema: 1
controller: SharedTree_Fx
basis: avatar-root
role: fx

defaults:
  writeDefaults: on

parameters:
  DirectBlend: { type: float, default: 1.0 }        # the always-1 weight every Direct child rides
  Intensity:   { type: float, default: 0.0, vrc: { synced: true } }
  Mode:        { type: float, default: 0.0 }        # 0 = local root, 1 = remote root
  Brow:        { type: float, aap: true }
  Jaw:         { type: float, aap: true }

clips:
  brow_min: { set: { Brow: 0.0 } }
  brow_max: { set: { Brow: 1.0 } }
  jaw_min:  { set: { Jaw: 0.0 } }
  jaw_max:  { set: { Jaw: 1.0 } }

trees:
  Blendshape Driver:
    tree: direct
    normalized: false
    children:
      - tree: 1d
        name: Brow
        param: Intensity
        directWeight: DirectBlend
        children:
          - { clip: brow_min, threshold: 0.0 }
          - { clip: brow_max, threshold: 1.0 }
      - tree: 1d
        name: Jaw
        param: Intensity
        directWeight: DirectBlend
        children:
          - { clip: jaw_min, threshold: 0.0 }
          - { clip: jaw_max, threshold: 1.0 }

layers:
  - name: Driver
    states:
      # Parent 1 — a state's own tree carries the shared driver as a child.
      Local Root:
        motion:
          tree: direct
          name: Local Root
          normalized: false
          children:
            - { shared: Blendshape Driver, directWeight: DirectBlend }
        transitions:
          - { to: Remote Root, when: [ Mode greater 0.5 ] }

      # Parent 2 — the mirror-image root, carrying the SAME object.
      Remote Root:
        motion:
          tree: direct
          name: Remote Root
          normalized: false
          children:
            - { shared: Blendshape Driver, directWeight: DirectBlend }
        transitions:
          - { to: Local Root, when: [ Mode less 0.5 ] }

      # Parent 3 — the driver alone, as a state motion. Unreachable by design: it is the node a human opens
      # to edit the tree, and editing it here changes what both roots play.
      Edit Driver:
        motion: { shared: Blendshape Driver }

    default: Local Root
    layout:
      nodes: { Local Root: [30, 180], Remote Root: [270, 180], Edit Driver: [30, 300] }
      entry: [50, 120]
      exit:  [50, 80]
      any:   [50, 40]
