# AAP exponential smoother — worked example for the animator write substrate; the idiom is
# docs/gimmicks.md "AAP exponential smoother".
#
# Smoothed_next = lambda * Smoothed + (1 - lambda) * Target, per frame. lambda is FRAMERATE-DEPENDENT: at a
# fixed lambda the settle time scales with fps. lambda=0.9 here closes ~10% of the gap per frame.

schema: 1
controller: Smoother_Fx
basis: avatar-root
role: fx

defaults:
  writeDefaults: on

parameters:
  Target:          { type: float, default: 0.0 }   # the input to smooth (driven externally)
  Smoothed:        { type: float, aap: true }       # the filtered output; the tree both reads and writes it
  SmoothFactor:    { type: float, default: 0.9 }    # lambda: fraction of the OLD value kept per frame
  SmoothFactorInv: { type: float, default: 0.1 }    # 1 - lambda: fraction of the NEW target mixed in

layers:
  - name: Smoother
    states:
      Filter:
        motion:
          tree: direct
          children:
            # maintain: read the current Smoothed value, weight it by lambda
            - tree: 1d
              param: Smoothed
              directWeight: SmoothFactor
              children:
                - { clip: aap_min, threshold: 0.0 }
                - { clip: aap_max, threshold: 1.0 }
            # apply: pull toward Target, weight it by (1 - lambda)
            - tree: 1d
              param: Target
              directWeight: SmoothFactorInv
              children:
                - { clip: aap_min, threshold: 0.0 }
                - { clip: aap_max, threshold: 1.0 }
    default: Filter

clips:
  aap_min: { set: { Smoothed: 0.0 } }
  aap_max: { set: { Smoothed: 1.0 } }
